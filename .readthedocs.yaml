#
# Configuration for readthedocs.org
#

# See uv builds on RTD:
#
# https://docs.readthedocs.io/en/stable/build-customization.html#install-dependencies-with-uv
#


version: 2

build:

  os: "ubuntu-22.04"

  tools:
    python: "3.10"

  jobs:

    post_install:
      # Install uv
      # https://docs.astral.sh/uv/getting-started/installation/
      - 'pip install uv'

      # Install dependencies, including the (optional) 'builddoc' dependency
      # group. https://docs.astral.sh/uv/concepts/projects/dependencies/#dependency-groups
      # Install into the virtualenv RTD has already set up for us, rather than
      # letting uv create its own .venv.
      - 'VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked --active --group builddoc'


sphinx:
  configuration: doc/conf.py
  builder: 'dirhtml'


name: 'tests-ci'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests-ci:

    strategy:
      fail-fast: true
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
        os:
          - 'ubuntu-latest'

    runs-on: '${{ matrix.os }}'

    steps:
      - uses: actions/checkout@v4
      - name: 'Set up uv'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '${{ matrix.python-version }}'
      - name: 'Install the project'
        run: uv sync --locked

      - name: 'Setup TeX Live (latex is needed for some latexpp tests)'
        uses: teatimeguest/setup-texlive-action@v2
        with:
          packages: >-
            scheme-basic
            cleveref
            hyperref
            crossreftools
            etoolbox

      - name: 'Run tests'
        run: uv run --no-sync pytest
